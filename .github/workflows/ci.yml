name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # release.yml runs the full suite before building and publishing

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          cache-dependency-glob: pyproject.toml
          python-version: ${{ matrix.python }}
      - run: uv venv --clear .venv
      - run: uv pip install -p .venv/bin/python -e ".[dev]"
      - run: VIRTUAL_ENV=$PWD/.venv .venv/bin/maturin develop --release
      - run: .venv/bin/python -m pytest -q

  peewee-suite:
    # peewee's own test-suite through rufee.Context. safe must be green;
    # strict reports the coverage pass rate.
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: peewee
          MYSQL_DATABASE: peewee_test
        ports: ["33306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -uroot -ppeewee --silent"
          --health-interval 2s --health-timeout 2s --health-retries 30
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: peewee
          POSTGRES_DB: peewee_test
        ports: ["35432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d peewee_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          cache-dependency-glob: pyproject.toml
          python-version: "3.11"
      - run: uv venv --clear .venv
      - run: uv pip install -p .venv/bin/python -e ".[dev]"
      - run: VIRTUAL_ENV=$PWD/.venv .venv/bin/maturin develop --release
      - run: make peewee-src
      - name: sqlite safe (must pass)
        run: .venv/bin/python scripts/run_peewee_tests.py -e sqlite --safe
      - name: mysql safe (must pass)
        run: .venv/bin/python scripts/run_peewee_tests.py -e mysql --safe
      - name: postgres / psycopg2 safe (must pass)
        run: .venv/bin/python scripts/run_peewee_tests.py -e postgres --safe
      - name: postgres / psycopg3 safe (must pass)
        run: .venv/bin/python scripts/run_peewee_tests.py -e psycopg3 --safe
      - name: sqlite strict (coverage report)
        run: .venv/bin/python scripts/run_peewee_tests.py -e sqlite --strict --json strict-sqlite.json | tail -40
      - name: mysql strict (coverage report)
        run: .venv/bin/python scripts/run_peewee_tests.py -e mysql --strict --json strict-mysql.json | tail -40
      - name: postgres / psycopg2 strict (coverage report)
        run: .venv/bin/python scripts/run_peewee_tests.py -e postgres --strict --json strict-postgres.json | tail -40
      - name: postgres / psycopg3 strict (coverage report)
        run: .venv/bin/python scripts/run_peewee_tests.py -e psycopg3 --strict --json strict-psycopg3.json | tail -40
      - name: strict pass rate to job summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          print("| engine | strict pass rate | pass | unsupported | fail | error |")
          print("|---|---|---|---|---|---|")
          for e in ("sqlite", "mysql", "postgres", "psycopg3"):
              d = json.load(open(f"strict-{e}.json")); c = d["counts"]
              print(f"| {e} | {d['pass_rate']:.1%} | {c['pass']} | {c['unsupported']} | {c['fail']} | {c['error']} |")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: strict-reports
          path: strict-*.json
