[package]
name = "rufee"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "peewee's SQL rendering Context, implemented in Rust"
repository = "https://github.com/yoshonabee/rufee"

[lib]
name = "rufee"
crate-type = ["cdylib", "rlib"]

[dependencies]
# `extension-module` is enabled by maturin (see pyproject.toml) so that
# `cargo test` can still link against libpython.
pyo3 = { version = "0.29", features = ["abi3-py311", "py-clone"] }

[features]
extension-module = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
