[package]
name = "rufee"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "peewee's SQL rendering Context, implemented in Rust"
repository = "https://github.com/yoshonabee/rufee"

[lib]
name = "rufee"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311", "py-clone"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
