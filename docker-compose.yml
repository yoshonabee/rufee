# MySQL for the peewee test-suite lane (scripts/run_peewee_tests.py -e mysql).
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: peewee
      MYSQL_DATABASE: peewee_test
    ports:
      - "33306:3306"
    # Test data only: keep it in memory and skip fsyncs, the suite is DDL-heavy.
    tmpfs:
      - /var/lib/mysql
    command: ["--innodb-flush-log-at-trx-commit=0", "--sync-binlog=0", "--skip-log-bin"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-ppeewee", "--silent"]
      interval: 2s
      timeout: 2s
      retries: 30
