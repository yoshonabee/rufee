[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "rufee"
version = "0.2.1"
description = "peewee's SQL rendering Context, implemented in Rust"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Topic :: Database",
]
dependencies = ["peewee>=4.5.3,<4.6"]

[project.optional-dependencies]
dev = [
  "pytest>=8", "hypothesis>=6", "pymysql>=1.1", "maturin>=1.15,<2.0",
  # playhouse.pwasyncio and its tests (tests/test_asyncio.py, peewee's tests.pwasyncio)
  "greenlet>=3", "aiosqlite>=0.20", "aiomysql>=0.2",
]

[project.urls]
Repository = "https://github.com/yoshonabee/rufee"

[tool.maturin]
python-source = "python"
module-name = "rufee._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: benchmark / long-running tests (still run by default; deselect with -m 'not slow')",
]
